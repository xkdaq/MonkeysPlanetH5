<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教育学帽子题 · 配对连连看</title>
<style>
/* ================= 设计令牌 · 与站点主站保持一致 ================= */
:root{
  --brand:#11b981;
  --brand-2:#07c160;
  --brand-dark:#067647;
  --brand-soft:#ecfdf3;
  --brand-border:#b7e4cd;
  --brand-ring:rgba(17,185,129,.18);

  --gold:#d9a441;
  --gold-soft:#fffaf0;
  --gold-border:#f2e3c2;
  --danger:#d92d20;

  --bg:#f6f8f6;
  --card:#ffffff;
  --card-2:#fbfdfc;
  --text-strong:#101828;
  --text-normal:#344054;
  --text-muted:#667085;
  --text-faint:#98a2b3;
  --line:#e7eaee;
  --line-soft:rgba(16,24,40,.06);
  --track:#e8ece9;

  /* 题干 = 蓝（对齐站点表格「典型题目」色）／答案 = 品牌绿 */
  --q-bg:#f0f6ff;  --q-bd:#c9ddfd;  --q-fg:#1d4ed8;  --q-tag:#2563eb;
  --a-bg:#ecfdf3;  --a-bd:#b7e4cd;  --a-fg:#067647;  --a-tag:#11b981;

  --shadow-sm:0 1px 2px rgba(16,24,40,.04), 0 4px 12px rgba(16,24,40,.04);
  --shadow:0 14px 30px rgba(16,24,40,.07);
  --shadow-lift:0 18px 40px rgba(16,24,40,.13);

  --r-lg:16px; --r-md:12px; --r-sm:10px; --r-pill:999px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html[data-theme="dark"]{
  --brand:#34d399;
  --brand-2:#10b981;
  --brand-dark:#6ee7b7;
  --brand-soft:rgba(16,185,129,.14);
  --brand-border:rgba(52,211,153,.3);
  --brand-ring:rgba(52,211,153,.22);

  --gold:#f0c274;
  --gold-soft:rgba(240,194,116,.12);
  --gold-border:rgba(240,194,116,.3);
  --danger:#f97066;

  --bg:#0f1512;
  --card:#17201c;
  --card-2:#1b251f;
  --text-strong:#e9f0ec;
  --text-normal:#c3d1ca;
  --text-muted:#8fa39a;
  --text-faint:#6b7d75;
  --line:rgba(255,255,255,.09);
  --track:rgba(255,255,255,.1);

  --q-bg:rgba(96,165,250,.13);  --q-bd:rgba(96,165,250,.3);  --q-fg:#a9cdff;  --q-tag:#60a5fa;
  --a-bg:rgba(52,211,153,.13);  --a-bd:rgba(52,211,153,.32); --a-fg:#8fe3c1;  --a-tag:#34d399;

  --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.22);
  --shadow:0 14px 32px rgba(0,0,0,.4);
  --shadow-lift:0 20px 44px rgba(0,0,0,.5);
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--sans);
  color:var(--text-normal);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 50% -180px, rgba(17,185,129,.16), transparent 300px),
    linear-gradient(180deg,#fbfcfd 0%, #f6f8f6 45%, #f2f6f3 100%);
  background-attachment:fixed;
  transition:background .3s ease,color .3s ease;
}
html[data-theme="dark"] body{
  background:
    radial-gradient(circle at 50% -180px, rgba(16,185,129,.18), transparent 320px),
    linear-gradient(180deg,#0f1512 0%, #0d130f 100%);
  background-attachment:fixed;
}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:18px 18px 40px;}

/* ---------- 顶部导航条 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.home-link{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;font-size:12.5px;font-weight:600;text-decoration:none;
  color:var(--brand-dark);background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-pill);
  box-shadow:var(--shadow-sm);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.home-link:hover{border-color:var(--brand-border);box-shadow:var(--shadow);transform:translateY(-1px);}
.home-link:active{transform:translateY(0) scale(.98);}
.home-link svg{width:13px;height:13px;}
.topbar .brandmark{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-faint);letter-spacing:.3px;}
.topbar .brandmark b{color:var(--brand-dark);font-weight:700;}

/* ---------- 报头 ---------- */
.masthead{
  display:flex;align-items:center;gap:16px;
  padding:18px 20px;margin-bottom:14px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
}
.seal{
  flex:none;width:50px;height:50px;border-radius:14px;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
  color:#fff;font-size:24px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(17,185,129,.28);
}
html[data-theme="dark"] .seal{color:#08150f;}
.mast-txt{flex:1;min-width:0;}
.mast-txt h1{font-size:21px;font-weight:800;letter-spacing:0;line-height:1.3;color:var(--text-strong);}
.mast-txt p{font-size:12.5px;color:var(--text-muted);margin-top:5px;}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.tool{
  padding:7px 14px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;
  background:var(--card);color:var(--text-muted);
  border:1px solid var(--line);border-radius:var(--r-pill);
  transition:transform .16s ease,border-color .16s ease,color .16s ease,background .16s ease,box-shadow .16s ease;
  -webkit-tap-highlight-color:transparent;
}
.tool:hover{color:var(--brand-dark);border-color:var(--brand-border);background:var(--brand-soft);}
.tool:active{transform:scale(.96);}
.tool[aria-pressed="true"]{
  color:#fff;background:var(--brand);border-color:var(--brand);
  box-shadow:0 6px 16px rgba(17,185,129,.26);
}
html[data-theme="dark"] .tool[aria-pressed="true"]{color:#08150f;}

/* ---------- 通用面板 ---------- */
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:16px 20px;margin-bottom:14px;
}
.statbar{display:flex;align-items:center;gap:0;flex-wrap:wrap;}
.stat{flex:1;min-width:78px;text-align:center;padding:2px 6px;position:relative;}
.stat + .stat::before{
  content:'';position:absolute;left:0;top:14%;height:72%;width:1px;background:var(--line);
}
.stat b{
  display:block;font-size:22px;font-weight:800;line-height:1.25;
  font-variant-numeric:tabular-nums;color:var(--text-strong);
  transform-origin:50% 60%;
}
.stat span{display:block;font-size:11px;color:var(--text-faint);margin-top:4px;letter-spacing:.5px;}
.stat b.s-score{color:var(--gold);}
.stat b.s-combo{color:var(--brand-dark);}
.stat b.s-cleared{color:var(--brand);}
.stat b.s-acc{color:var(--text-strong);}
.stat b.s-time{color:var(--text-normal);font-size:19px;padding-top:2px;}
.stat b.hot{color:var(--gold);}
.stat b.pop{animation:statPop .42s cubic-bezier(.3,1.4,.5,1);}
@keyframes statPop{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}

/* ---------- 关卡条 ---------- */
.levelbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.lv-name{font-size:15px;font-weight:700;color:var(--text-strong);white-space:nowrap;}
.lv-name em{font-style:normal;color:var(--brand-dark);font-size:13px;margin-left:8px;background:var(--brand-soft);padding:3px 10px;border-radius:var(--r-pill);}
.track{flex:1;min-width:120px;height:8px;background:var(--track);border-radius:var(--r-pill);overflow:hidden;}
.fill{
  height:100%;width:0;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--brand) 0%,var(--brand-2) 100%);
  box-shadow:0 0 10px rgba(17,185,129,.35);
  transition:width .45s cubic-bezier(.4,0,.2,1);
}
.remain{font-size:12.5px;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
.lv-pick{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--sans);font-size:12.5px;font-weight:600;
  padding:6px 11px 6px 13px;cursor:pointer;
  background:var(--card-2);color:var(--text-normal);
  border:1px solid var(--line);border-radius:var(--r-pill);
  max-width:220px;flex-shrink:0;
  transition:border-color .16s ease,background .16s ease,box-shadow .16s ease;
}
.lv-pick:hover{border-color:var(--brand-border);background:var(--brand-soft);color:var(--brand-dark);}
.lv-pick.open{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring);background:var(--card);}
.lv-pick>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;}
.lv-pick-arrow{font-size:11px;color:var(--text-muted);transition:transform .2s ease;}
.lv-pick.open .lv-pick-arrow{transform:rotate(180deg);color:var(--brand-dark);}

.lvl-sheet{padding:28px 22px 22px;}
.lvl-sheet h4{
  font-size:14px;font-weight:800;color:var(--text-muted);
  margin:0 0 14px;text-align:center;letter-spacing:3px;
}
.lvl-options{
  list-style:none;margin:0 0 14px;padding:0;
  display:flex;flex-direction:column;gap:6px;
  max-height:52vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.lvl-options li{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;cursor:pointer;
  background:var(--card-2);border:1px solid var(--line);
  font-size:13px;color:var(--text-normal);
  transition:border-color .15s ease,background .15s ease,transform .12s ease;
  text-align:left;
}
.lvl-options li:hover{border-color:var(--brand-border);background:var(--card);}
.lvl-options li:active{transform:scale(.99);}
.lvl-options li.active{
  border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark);font-weight:700;
}
.lvl-options li.locked{opacity:.45;cursor:not-allowed;}
.lvl-options li .opt-idx{
  width:26px;height:26px;flex-shrink:0;
  border-radius:8px;background:var(--line);
  color:var(--text-muted);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.lvl-options li.active .opt-idx{background:var(--brand);color:#fff;}
html[data-theme="dark"] .lvl-options li.active .opt-idx{color:#08150f;}
.lvl-options li .opt-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lvl-options li .opt-meta{font-size:11px;color:var(--text-faint);font-weight:500;flex-shrink:0;}
.lvl-options li.active .opt-meta{color:var(--brand-dark);}

/* ---------- 棋盘 ---------- */
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.col{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:14px 16px 16px;
}
.col-head{
  font-size:13px;font-weight:800;letter-spacing:2px;
  color:var(--text-normal);padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;
}
.col-head i{width:8px;height:8px;border-radius:3px;display:block;}
.col.q .col-head i{background:var(--q-tag);}
.col.a .col-head i{background:var(--a-tag);}
.col-head small{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:0;color:var(--text-faint);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}

.card{
  position:relative;font-family:var(--sans);font-size:13px;line-height:1.6;
  text-align:left;padding:14px;min-height:86px;
  display:flex;align-items:center;
  border-radius:var(--r-md);border:1px solid transparent;
  cursor:pointer;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease,opacity .3s ease;
  box-shadow:var(--shadow-sm);
  -webkit-tap-highlight-color:transparent;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.card:active{transform:translateY(0) scale(.985);box-shadow:var(--shadow-sm);}
.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
.card.q{background:var(--q-bg);border-color:var(--q-bd);color:var(--q-fg);}
.card.a{background:var(--a-bg);border-color:var(--a-bd);color:var(--a-fg);}
.card.sel{
  border-color:var(--brand);transform:translateY(-2px);
  box-shadow:0 0 0 3px var(--brand-ring), var(--shadow);
}
.card.bad{animation:shake .42s ease;border-color:var(--danger) !important;box-shadow:0 0 0 3px rgba(217,45,32,.16) !important;}
.card.good{animation:pop .5s ease forwards;}
.card.hint{animation:glow 1.1s ease infinite;}
.card.gone{visibility:hidden;pointer-events:none;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  15%{transform:translateX(-6px);}35%{transform:translateX(6px);}
  55%{transform:translateX(-4px);}75%{transform:translateX(3px);}
}
@keyframes pop{
  0%{transform:scale(1);opacity:1;}
  45%{transform:scale(1.06);opacity:.9;box-shadow:0 0 0 6px var(--brand-ring);}
  100%{transform:scale(.88);opacity:0;}
}
@keyframes glow{
  0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 12px rgba(217,164,65,.35);}
  50%{box-shadow:0 0 0 4px var(--gold),0 0 22px rgba(217,164,65,.55);}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ---------- 操作 ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.btn{
  font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;
  padding:10px 22px;border-radius:var(--r-pill);border:1px solid var(--brand);
  background:var(--brand);color:#fff;
  box-shadow:0 8px 20px rgba(17,185,129,.22);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease,color .16s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(17,185,129,.3);background:var(--brand-dark);border-color:var(--brand-dark);}
.btn:active{transform:translateY(1px) scale(.99);box-shadow:0 4px 12px rgba(17,185,129,.2);}
.btn.ghost{background:var(--card);color:var(--brand-dark);border-color:var(--brand-border);box-shadow:var(--shadow-sm);}
.btn.ghost:hover{background:var(--brand-soft);border-color:var(--brand);box-shadow:var(--shadow);}
.btn.gold{background:var(--gold-soft);color:#a1651a;border-color:var(--gold-border);box-shadow:var(--shadow-sm);}
.btn.gold:hover{background:var(--gold);color:#fff;border-color:var(--gold);box-shadow:0 10px 22px rgba(217,164,65,.28);}
.btn.warn{background:var(--card);color:var(--danger);border-color:rgba(217,45,32,.32);box-shadow:var(--shadow-sm);}
.btn.warn:hover{background:var(--danger);color:#fff;border-color:var(--danger);box-shadow:0 10px 22px rgba(217,45,32,.24);}
html[data-theme="dark"] .btn{color:#08150f;}
html[data-theme="dark"] .btn.ghost{color:var(--brand-dark);}
html[data-theme="dark"] .btn.gold{color:var(--gold);}
html[data-theme="dark"] .btn.warn{color:var(--danger);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
  background:#101828;color:#fff;
  padding:13px 22px;border-radius:14px;font-size:13px;
  max-width:min(460px,90vw);
  z-index:200;opacity:0;pointer-events:none;
  transition:opacity .28s ease,transform .28s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 18px 44px rgba(16,24,40,.32);text-align:center;line-height:1.6;
}
html[data-theme="dark"] #toast{background:#eef4f0;color:#101828;box-shadow:0 18px 44px rgba(0,0,0,.5);}
#toast.on{opacity:1;transform:translate(-50%,0);}
#toast b{display:block;font-size:11px;letter-spacing:2px;font-weight:800;color:#34d399;margin-bottom:7px;}
html[data-theme="dark"] #toast b{color:var(--brand-dark);}
#toast .w-q{display:block;font-size:13.5px;font-weight:600;}
#toast .w-line{display:block;margin-top:3px;font-size:13px;color:#98a2b3;}
html[data-theme="dark"] #toast .w-line{color:#4d635a;}
#toast .w-line em{font-style:normal;font-weight:700;color:#fff;}
html[data-theme="dark"] #toast .w-line em{color:#101828;}
#toast .w-line i{font-style:normal;font-size:12px;}

/* ---------- 弹窗 ---------- */
.veil{
  position:fixed;inset:0;background:rgba(16,24,40,.55);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  z-index:300;display:none;align-items:center;justify-content:center;padding:20px;
}
.veil.on{display:flex;}
.sheet{
  background:var(--card);max-width:440px;width:100%;
  border-radius:20px;border:1px solid var(--line);
  border-top:4px solid var(--brand);
  padding:32px 30px 26px;text-align:center;
  box-shadow:0 30px 70px rgba(16,24,40,.3);
  animation:rise .35s cubic-bezier(.2,.9,.3,1);
}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0;}to{transform:none;opacity:1;}}
.badge{
  width:62px;height:62px;margin:0 auto 16px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
  color:#fff;font-size:25px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(17,185,129,.32);
}
html[data-theme="dark"] .badge{color:#08150f;}
.sheet h2{font-size:22px;font-weight:800;color:var(--text-strong);margin-bottom:8px;}
.sheet .lead{font-size:13.5px;color:var(--text-muted);line-height:1.7;margin-bottom:20px;}
.tally{display:flex;justify-content:center;gap:26px;margin-bottom:22px;flex-wrap:wrap;}
.tally div{text-align:center;}
.tally b{display:block;font-size:25px;font-weight:800;color:var(--text-strong);font-variant-numeric:tabular-nums;}
.tally span{font-size:11px;color:var(--text-faint);letter-spacing:.5px;}
.sheet .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

.tip{font-size:11.5px;color:var(--text-faint);text-align:center;margin-top:18px;line-height:1.8;}
.foot{
  margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
  text-align:center;font-size:11.5px;color:var(--text-faint);line-height:1.9;
}
.foot a{color:var(--text-muted);text-decoration:none;}
.foot a:hover{color:var(--brand-dark);}

@media (max-width:900px){
  /* 题目与答案左右同列，单屏可同时看到两栏 */
  .board{grid-template-columns:1fr 1fr;gap:10px;}
  .col{padding:12px 12px 14px;}
  .col-head{padding-bottom:8px;margin-bottom:10px;font-size:12px;letter-spacing:1.5px;}
  .col-head i{width:7px;height:7px;}
  .grid{grid-template-columns:1fr;gap:8px;}
  .card{min-height:52px;font-size:12px;line-height:1.5;padding:10px 11px;}
}
@media (max-width:640px){
  .wrap{padding:12px 10px 28px;}
  .topbar{margin-bottom:10px;}
  .topbar .brandmark{display:none;}
  .home-link{padding:6px 11px;font-size:11.5px;}
  .masthead{flex-wrap:wrap;padding:12px 14px;gap:12px;border-radius:14px;}
  .tools{width:100%;justify-content:flex-start;gap:6px;}
  .tool{padding:6px 11px;font-size:11.5px;}
  .seal{width:40px;height:40px;font-size:19px;border-radius:11px;}
  .mast-txt h1{font-size:17px;}
  .mast-txt p{font-size:11px;margin-top:3px;}
  .panel{padding:10px 12px;border-radius:14px;}
  .statbar{padding:2px 0;}
  .stat b{font-size:17px;}
  .stat span{font-size:10.5px;margin-top:2px;}
  .stat{min-width:52px;padding:2px 2px;}
  .levelbar{gap:10px;}
  .lv-name{font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis;}
  .lv-name em{display:none;}
  select.jump{display:none;}
  .track{min-width:80px;height:6px;}
  .remain{font-size:11.5px;}
  .board{gap:8px;margin-bottom:12px;}
  .col{padding:10px 10px 12px;border-radius:14px;}
  .col-head{padding-bottom:6px;margin-bottom:8px;font-size:11.5px;letter-spacing:1px;}
  .col-head i{width:6px;height:6px;}
  .grid{gap:6px;}
  .card{min-height:44px;font-size:11.5px;line-height:1.45;padding:9px 10px;border-radius:10px;}

<script>
/* ==================== 题库（与原版完全一致，未做任何改动） ==================== */
const LEVELS = [{"name":"中国教育史·最早（一）","pairs":[{"q":"中国历史上记载最早的儿童识字课本","a":"《史籀篇》"},{"q":"中国最早的诗歌选集","a":"《诗》"},{"q":"世界上最早提出启发式教学的教育家","a":"孔子"},{"q":"世界上最早的专门论述教育、教学问题的论著","a":"《学记》"},{"q":"世界上最早研究文学艺术的专门学校","a":"鸿都门学"},{"q":"最早利用学校教育来强化官方的意识形态","a":"汉代太学"},{"q":"国子学最早创立于","a":"西晋"},{"q":"首创皇宗学","a":"北魏"}]},{"name":"中国教育史·最早（二）","pairs":[{"q":"宋朝设立的最早的专科学校，培养军事人才","a":"武学"},{"q":"画学最早设立于","a":"宋朝（北宋）"},{"q":"我国中央官学中最早的外国语学校","a":"回回国子学（元朝）"},{"q":"近代议会思想的萌芽","a":"黄宗羲“公其非是于学校”"},{"q":"我国最早的官办新式学校/第一所洋务学堂","a":"京师同文馆"},{"q":"开我国近代职工在职教育的先声","a":"福建船政学堂"},{"q":"最早提出幼童留美教育的人","a":"容闳"},{"q":"最早倡导改书院为学堂","a":"郑观应"}]},{"name":"中国教育史·第一（一）","pairs":[{"q":"历史上第一个学生守则","a":"《弟子职》"},{"q":"我国现存的第一部编年史","a":"《春秋》"},{"q":"第一次明确概括出中国古代学校教育的目的是“明人伦”","a":"孟子"},{"q":"学术思想史上第一个批判儒家的人","a":"墨子"},{"q":"我国封建社会第一本系统完整的家庭教科书","a":"《颜氏家训》"},{"q":"中国古代第一篇集中论述教师问题的重要著作","a":"《师说》"},{"q":"历史上第一次提出教师的基本任务的教育家","a":"韩愈"},{"q":"近代第一个在华基督教会联合组织","a":"学校与教科书委员会"}]},{"name":"中国教育史·第一（二）","pairs":[{"q":"近代中国政府派出的第一批留学生","a":"幼童留美"},{"q":"第一次提出“中体西用”思想的人","a":"冯桂芬"},{"q":"中国第一所国人创办的正规女子学校","a":"经正女学"},{"q":"中国近代第一个以中央政府名义制定的全国性学制系统","a":"壬寅学制"},{"q":"中国近代由中央政府颁布并第一次得到施行的全国性法定学制系统","a":"癸卯学制"},{"q":"我国近代第一个资产阶级性质的学制","a":"壬子癸丑学制"},{"q":"第一任教育总长，首创“五育”并举的思想","a":"蔡元培"},{"q":"我国第一所实验幼稚园","a":"鼓楼幼稚园（陈鹤琴）"}]},{"name":"中国教育史·最+中心+标志","pairs":[{"q":"先秦最后一位儒家大师，最为提倡尊师","a":"荀子"},{"q":"墨家教育思想最具特色的","a":"科技教育和思维训练"},{"q":"西汉时流传最广、影响最大的蒙学教材","a":"《急就篇》"},{"q":"“六艺”教育的中心","a":"礼乐教育"},{"q":"董仲舒的道德教育内容核心","a":"“三纲五常”"},{"q":"科举考试制度确立的标志","a":"隋炀帝大业二年“始建进士科”"},{"q":"标志着中国近代以来国家学制体系建设的基本完成","a":"壬戌学制（1922年“新学制”）"},{"q":"“世界平民教育运动之父”","a":"晏阳初"}]},{"name":"中国教育史·爸爸+标志","pairs":[{"q":"中国“职业教育之父”","a":"黄炎培"},{"q":"中国“幼儿教育之父”","a":"陈鹤琴"},{"q":"标志着太学正式成立","a":"汉武帝下令为五经博士设弟子"},{"q":"标志着“活教育”理论的形成","a":"《活教育》"},{"q":"标志着以黄炎培为代表的职业教育思潮的形成","a":"《中华职业教育社宣言书》"},{"q":"“百日维新”时期全国最高的学府","a":"京师大学堂"},{"q":"在王充提出的教育目标里，最高级的一层","a":"鸿儒"},{"q":"开主修和副修制度的先声","a":"分斋教学中的治事斋"}]},{"name":"外国教育史·最早","pairs":[{"q":"古代巴比伦最早的学校","a":"泥板书舍"},{"q":"人类有史可稽最古老的学校","a":"宫廷学校（古埃及）"},{"q":"西方最早的职业教师","a":"智者派"},{"q":"西方国家首先提出学前教育的人","a":"柏拉图"},{"q":"西方最早的高等教育机构","a":"学园（柏拉图）"},{"q":"最早提出“德智体和谐发展”的教育思想","a":"亚里士多德"},{"q":"西方最早的教育教学著作","a":"《雄辩术原理》"},{"q":"最早阐述人文主义教育思想的教育家","a":"弗吉里奥"}]},{"name":"外国教育史·第一（一）","pairs":[{"q":"被称为“在西方教育史上有长远影响的第一位教育家”","a":"苏格拉底"},{"q":"教育史上第一次提出了双语教育问题","a":"昆体良"},{"q":"英国教育史上第一部关于初等教育的法律","a":"《初等教育法》（1870年）"},{"q":"欧洲第一所新式大学","a":"哈勒大学"},{"q":"美国第一所高等学府","a":"哈佛学院"},{"q":"近代第一部教育学著作/独立形态的教育学的开端","a":"《大教学论》"},{"q":"被誉为世界上第一本论述学前教育的专著","a":"《母育学校》"},{"q":"欧洲第一部儿童看图识字课本","a":"《世界图解》"}]},{"name":"外国教育史·第一（二）","pairs":[{"q":"在教育史上第一个系统总结了教学原则","a":"夸美纽斯"},{"q":"在西方教育史上，第一个明确提出“教育心理学化”口号","a":"裴斯泰洛齐"},{"q":"西方历史上第一位把心理学作为一门独立学科加以研究","a":"赫尔巴特"},{"q":"创办世界上第一所幼儿园","a":"福禄培尔"},{"q":"第一个提出“实验教育学”的名称","a":"梅伊曼"},{"q":"俄国第一位马克思主义教育家","a":"克鲁普斯卡娅"},{"q":"在俄国历史上第一次规定建立女子学校","a":"《国民教育部女子学校章程》"},{"q":"苏联教育史上第一个重要的教育立法","a":"《统一劳动学校规程》"}]},{"name":"外国教育史·第一（三）","pairs":[{"q":"英国进入20世纪所制定和颁布的第一个重要教育法案","a":"《巴尔福教育法》"},{"q":"联邦德国战后第一部有权威的高等教育方面的法律","a":"《高等学校总纲法》"},{"q":"俄罗斯独立以后第一部基本教育法","a":"《俄罗斯联邦教育法》"},{"q":"20世纪90年代法国第一次对全部教育体系课程编排建立规范性文件","a":"《课程宪章》"},{"q":"英国首次明确宣布教育立法要考虑建立面向全体的全国公共教育制度","a":"《费舍教育法》"},{"q":"英国首次从国家角度阐明初等教育与中等教育衔接","a":"《哈多报告》"},{"q":"英国自20世纪60年代后第一个全面回顾与反思高等教育的纲领性文件","a":"《学习社会中的高等教育》"},{"q":"1898年创办德国第一所乡村教育学校","a":"利茨"}]},{"name":"外国教育史·中心+标志","pairs":[{"q":"赫尔巴特“旧三中心”","a":"教师中心、教材中心、课堂中心"},{"q":"杜威“新三中心”","a":"儿童中心、经验中心、活动中心"},{"q":"标志着教育工作开始职业化","a":"智者的出现"},{"q":"标志着教育学已经成为一门独立的学科","a":"《普通教育学》"},{"q":"标志着新教育运动的开端","a":"雷迪创办阿博茨霍尔姆学校"},{"q":"标志着进步主义教育运动的兴起","a":"帕克创造“昆西教学法”"},{"q":"标志着法国初等教育步入一个新的历史发展阶段的法案","a":"《费里法案》"},{"q":"标志着法国职业教育改革达到高潮","a":"《哈比法》"}]},{"name":"外国教育史·人物+爸爸","pairs":[{"q":"“德国教师的教师”","a":"第斯多惠"},{"q":"“俄国教师的教师”","a":"乌申斯基"},{"q":"“美国公立学校之父”","a":"贺拉斯·曼"},{"q":"“普及教育之父”（免费学校的创始人）","a":"加尔文"},{"q":"附设在古埃及寺庙中，着重科学技术教育，也是学术中心","a":"僧侣学校（寺庙学校）"},{"q":"进步教育运动成型期，美国进步教育运动的中心","a":"哥伦比亚大学师范学院"},{"q":"标志着英国新大学运动的开始","a":"伦敦大学学院的成立"},{"q":"标志着英国高等教育“双重制”的彻底终结","a":"《1992年继续教育和高等教育法》"}]}];

/* ==================== 常量与状态 ==================== */
const KEY = 'maozi-pair-v1';
const WRONG = -1;

let lvIndex = 0;          // 当前关（WRONG = 错题关）
let unlocked = 0;         // 已解锁到的最大关
let score = 0, combo = 0, cleared = 0;
let hits = 0, tries = 0;  // 正确率
let secs = 0, timer = null;
let picked = null;
let cards = [], left = 0, busy = false, hinting = false;
let freeHint = 1;
let wrongSet = [];        // "关卡_题号"
let sound = true;
let reveal = false;       // 是否公布正确答案（默认关闭，保留排除推理的乐趣）
let _pv = {score:null, combo:null};   // 仅用于数字变化的动效，不影响任何逻辑

/* ==================== 工具 ==================== */
const $ = id => document.getElementById(id);
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function fmt(s){const m=String(Math.floor(s/60)).padStart(2,'0'),x=String(s%60).padStart(2,'0');return m+':'+x;}
let toastTimer=null;
function toast(msg,dur){
  const t=$('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),dur||1600);
}
/* 搭配错误：显示玩家所点题目的真正正确答案 */
function toastWrong(qText,aText,pickedText){
  const t=$('toast');
  t.innerHTML='<b>搭配错误</b>'
    +'<span class="w-q">「'+qText+'」</span>'
    +'<span class="w-line">正确答案 <em>'+aText+'</em> <i>（你选的是 '+pickedText+'）</i></span>';
  t.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),3000);
}
function rate(){return tries? Math.round(hits/tries*100)+'%' : '—';}
/* 数字变化时轻微放大反馈（纯视觉，不影响数值与存档） */
function flash(id){
  const e=$(id); if(!e)return;
  e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop');
}

/* ---------- 音效（Web Audio 合成，无外部文件） ---------- */
let ac=null;
function beep(freq,dur,type,vol,delay){
  if(!sound)return;
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    const t0=ac.currentTime+(delay||0);
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol||0.05,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+0.02);
  }catch(e){}
}
const sfxGood = ()=>{beep(659,.13,'sine',.05,0);beep(988,.18,'sine',.04,.07);};
const sfxBad  = ()=>{beep(196,.2,'triangle',.045,0);};
const sfxTick = ()=>{beep(440,.05,'square',.025,0);};
const sfxWin  = ()=>{[523,659,784,1047].forEach((f,i)=>beep(f,.26,'sine',.05,i*.1));};

/* ==================== 存档 ==================== */
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({
      lvIndex: lvIndex===WRONG?0:lvIndex, unlocked, score, combo,
      cleared, hits, tries, secs, wrongSet, sound, reveal,
      theme: document.documentElement.getAttribute('data-theme')
    }));
  }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return false;
    const d=JSON.parse(raw);
    unlocked=Math.min(d.unlocked|0, LEVELS.length-1);
    lvIndex=Math.min(d.lvIndex|0, unlocked);
    score=d.score|0; combo=d.combo|0; cleared=d.cleared|0;
    hits=d.hits|0; tries=d.tries|0; secs=d.secs|0;
    wrongSet=Array.isArray(d.wrongSet)?d.wrongSet:[];
    sound=d.sound!==false;
    reveal=d.reveal===true;
    if(d.theme==='dark') document.documentElement.setAttribute('data-theme','dark');
    return (d.cleared|0)>0 || (d.secs|0)>0;
  }catch(e){return false;}
}
function wipe(){try{localStorage.removeItem(KEY);}catch(e){}}

/* ==================== 计时 ==================== */
function tick(){secs++;$('vTime').textContent=fmt(secs);if(secs%10===0)save();}
function startClock(){if(!timer)timer=setInterval(tick,1000);}
function stopClock(){clearInterval(timer);timer=null;}

/* ==================== 关卡装载 ==================== */
function loadLevel(idx,keepScore){
  lvIndex=idx;
  const isW = idx===WRONG;
  const pairs = isW ? wrongPairs() : LEVELS[idx].pairs;

  if(!keepScore){combo=0;}
  picked=null;busy=false;hinting=false;freeHint=1;
  left=pairs.length;

  $('vLevel').innerHTML = isW
    ? '错题重练 <em id="vLevelName">共 '+pairs.length+' 组</em>'
    : '第 '+(idx+1)+' 关 / 共 '+LEVELS.length+' 关 <em id="vLevelName">'+LEVELS[idx].name+'</em>';

  cards=[];
  pairs.forEach((p,i)=>{
    cards.push({id:'q'+i,ref:p.ref!==undefined?p.ref:(idx+'_'+i),type:'q',text:p.q,done:false});
    cards.push({id:'a'+i,ref:p.ref!==undefined?p.ref:(idx+'_'+i),type:'a',text:p.a,done:false});
  });

  buildJump();
  paint();
}
function wrongPairs(){
  const seen={},out=[];
  wrongSet.forEach(k=>{
    if(seen[k])return;seen[k]=1;
    const [l,i]=k.split('_').map(Number);
    if(LEVELS[l]&&LEVELS[l].pairs[i]) out.push(Object.assign({},LEVELS[l].pairs[i],{ref:k}));
  });
  return out;
}

/* 只刷新数字，不重建卡片（避免打断配对动画） */
function syncStats(){
  $('vRemain').textContent=left;
  const total=cards.length/2, done=total-left;
  $('fill').style.width=(total?done/total*100:0)+'%';
  if(_pv.score!==null && _pv.score!==score) flash('vScore');
  if(_pv.combo!==null && _pv.combo!==combo) flash('vCombo');
  _pv.score=score; _pv.combo=combo;
  $('vScore').textContent=score;
  $('vCombo').textContent=combo;
  $('vCombo').classList.toggle('hot', combo>=3);
  $('vCleared').textContent=cleared;
  $('vAcc').textContent=rate();
  $('btnHint').textContent = freeHint>0 ? '提示（免费 1 次）' : '提示（-20 分）';
  $('btnHint').disabled = (left===0||!cards.some(c=>!c.done));
  $('btnWrong').textContent = '错题重练'+(wrongSet.length?'（'+wrongSet.length+'）':'');
}
/* 重建两栏卡片 + 刷新数字 */
function paint(){
  ['q','a'].forEach(t=>{
    const g=$('grid'+t.toUpperCase());
    g.innerHTML='';
    shuffle(cards.filter(c=>c.type===t)).forEach(c=>{
      const b=document.createElement('button');
      b.className='card '+t+(c.done?' gone':'');
      b.dataset.id=c.id;
      b.innerHTML='<span>'+c.text+'</span>';
      b.onclick=()=>hit(c.id);
      g.appendChild(b);
    });
  });
  syncStats();
}
function cardEl(id){return document.querySelector('[data-id="'+id+'"]');}

/* ==================== 交互 ==================== */
function hit(id){
  if(busy)return;
  const c=cards.find(x=>x.id===id);
  if(!c||c.done)return;
  startClock();
  if(hinting){document.querySelectorAll('.card.hint').forEach(e=>e.classList.remove('hint'));hinting=false;}
  const el=cardEl(id);

  if(!picked){picked=c;el.classList.add('sel');sfxTick();return;}
  if(picked.id===id){el.classList.remove('sel');picked=null;return;}

  const first=picked, fe=cardEl(first.id);
  el.classList.add('sel');

  if(first.type===c.type){
    busy=true;combo=0;
    fe.classList.add('bad');el.classList.add('bad');sfxBad();
    setTimeout(()=>{fe.classList.remove('sel','bad');el.classList.remove('sel','bad');picked=null;busy=false;syncStats();},450);
    syncStats();
    return;
  }

  tries++;
  const ok = (first.ref===c.ref);
  if(ok){
    busy=true;hits++;combo++;score+=10+(combo-1)*2;cleared++;left--;
    fe.classList.add('good');el.classList.add('good');sfxGood();
    c.done=true;first.done=true;
    const i=wrongSet.indexOf(c.ref); if(i>-1)wrongSet.splice(i,1);
    setTimeout(()=>{
      fe.classList.add('gone');el.classList.add('gone');
      fe.classList.remove('sel','good');el.classList.remove('sel','good');
      picked=null;busy=false;
      syncStats();
      if(left===0) finish();
    },480);
  }else{
    busy=true;combo=0;
    fe.classList.add('bad');el.classList.add('bad');sfxBad();
    // 认定「题目」一侧为准：错题本记录该题，提示语给出该题真正的答案
    const qc = first.type==='q' ? first : c;
    const ac = first.type==='q' ? c : first;
    if(wrongSet.indexOf(qc.ref)<0) wrongSet.push(qc.ref);
    // 默认只说「不匹配」，不开对答案模式就不剧透，靠排除法继续推
    if(reveal){
      const right = cards.find(x=>x.ref===qc.ref && x.type!==qc.type);
      toastWrong(qc.text, right?right.text:ac.text, ac.text);
      if(right){
        const re=cardEl(right.id);
        if(re){re.classList.add('hint');hinting=true;
          setTimeout(()=>{re.classList.remove('hint');hinting=false;},2400);}
      }
    }else{
      toast('不匹配',1100);
    }
    setTimeout(()=>{
      fe.classList.remove('sel','bad');el.classList.remove('sel','bad');
      picked=null;busy=false;syncStats();
    },450);
  }
  syncStats();
  save();
}

function useHint(){
  if(busy||left===0)return;
  const pool=cards.filter(c=>!c.done);
  if(!pool.length)return;
  if(freeHint>0){freeHint--;}
  else if(score>=20){score-=20;}
  else{toast('分数不足 20，无法使用提示');return;}
  combo=0;
  const ref=shuffle(pool)[0].ref;
  hinting=true;
  cards.filter(c=>c.ref===ref&&!c.done).forEach(c=>{
    const e=cardEl(c.id); if(e)e.classList.add('hint');
  });
  syncStats();save();
  setTimeout(()=>{
    document.querySelectorAll('.card.hint').forEach(e=>e.classList.remove('hint'));
    hinting=false;
  },3000);
}
function shuffleCards(){
  if(busy)return;
  if(picked){const e=cardEl(picked.id);if(e)e.classList.remove('sel');picked=null;}
  sfxTick();paint();
}
function clearPick(){
  if(!picked||busy)return;
  const e=cardEl(picked.id);if(e)e.classList.remove('sel');picked=null;
}

/* ==================== 流程 ==================== */
function finish(){
  if(lvIndex===WRONG){
    stopClock();save();
    $('mTitle').textContent='错题清空';
    $('mLead').textContent='错题已全部消除，仍可继续返回正式关卡复习。';
    fillTally();
    $('mWrongBtn').style.display='none';
    sfxWin();openVeil();return;
  }
  if(lvIndex<LEVELS.length-1){
    unlocked=Math.max(unlocked,lvIndex+1);
    toast('第 '+(lvIndex+1)+' 关完成 · 进入下一关',1500);
    sfxGood();
    setTimeout(()=>{loadLevel(lvIndex+1,true);save();},900);
  }else{
    unlocked=LEVELS.length-1;stopClock();save();
    $('mTitle').textContent='全部通关';
    $('mLead').textContent='12 关 96 组帽子题全部消除，中外教育史基础打得扎实。';
    fillTally();
    $('mWrongBtn').style.display=wrongSet.length?'':'none';
    sfxWin();openVeil();
  }
}
function fillTally(){
  $('mScore').textContent=score;
  $('mAcc').textContent=rate();
  $('mTime').textContent=fmt(secs);
  $('mWrong').textContent=wrongSet.length;
}
function openVeil(){$('veil').classList.add('on');}
function closeVeil(){$('veil').classList.remove('on');$('mWrongBtn').style.display='';}

function enterWrong(){
  closeVeil();
  if(!wrongSet.length){toast('还没有错题记录');return;}
  loadLevel(WRONG,true);
  toast('错题重练：答对一组即从错题本移除',2200);
}
function buildJump(){
  // 仅刷新弹层里的关卡列表与触发按钮上的当前关名；弹层未打开时不重建 DOM，避免影响主视图
  const list=$('lvlOptions');
  if(!list)return;
  const cur=lvIndex===WRONG?WRONG:lvIndex;
  let h='';
  for(let i=0;i<LEVELS.length;i++){
    const isOpen=i<=unlocked;
    const name=LEVELS[i].name;
    const meta=i===cur?'当前':((i<unlocked?'已通关':(i===unlocked?'进行中':'未解锁')));
    const cls='lvl-opt'+(i===cur?' active':'')+(isOpen?'':' locked');
    h+='<li class="'+cls+'" data-i="'+i+'"'+(isOpen?'':' aria-disabled="true"')+' role="button">'
       +'<span class="opt-idx">'+(i+1)+'</span>'
       +'<span class="opt-name">'+name+'</span>'
       +'<span class="opt-meta">'+meta+'</span>'
       +'</li>';
  }
  if(wrongSet.length){
    h+='<li class="lvl-opt'+(cur===WRONG?' active':'')+'" data-i="-1" role="button">'
      +'<span class="opt-idx">错</span>'
      +'<span class="opt-name">错题重练</span>'
      +'<span class="opt-meta">'+wrongSet.length+' 题</span>'
      +'</li>';
  }
  list.innerHTML=h;
  $('lvPickText').textContent = cur===WRONG ? '错题重练 · '+wrongSet.length : '第 '+(cur+1)+' 关 · '+LEVELS[cur].name;
}
function openLevelPicker(){
  buildJump();
  const v=$('lvlVeil'); v.classList.add('on');
  $('lvPick').classList.add('open');
  v.addEventListener('click',e=>{ if(e.target===v||e.target.classList.contains('sheet')) closeLevelPicker(); });
  $('lvlOptions').onclick=e=>{
    const li=e.target.closest('.lvl-opt'); if(!li||li.classList.contains('locked'))return;
    const v2=parseInt(li.dataset.i,10);
    closeLevelPicker();
    if(v2===WRONG){enterWrong();return;}
    if(v2===lvIndex)return;
    loadLevel(v2,true);save();
  };
}
function closeLevelPicker(){
  $('lvlVeil').classList.remove('on');
  $('lvPick').classList.remove('open');
}

/* ==================== 顶栏开关 ==================== */
function toggleSound(){
  sound=!sound;
  $('btnSound').setAttribute('aria-pressed',String(sound));
  $('btnSound').textContent=sound?'音效':'静音';
  if(sound)sfxTick();
  save();
}
function toggleTheme(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  $('btnTheme').setAttribute('aria-pressed',String(!dark));
  $('btnTheme').textContent=dark?'夜间':'日间';
  save();
}
function toggleReveal(){
  reveal=!reveal;
  $('btnReveal').setAttribute('aria-pressed',String(reveal));
  $('btnReveal').textContent=reveal?'对答案 · 开':'对答案';
  toast(reveal?'已开启：搭配错误时直接公布正确答案':'已关闭：搭配错误只提示不匹配，自己推',2000);
  save();
}

/* ==================== 重置 ==================== */
function hardReset(){
  wipe();
  stopClock();
  score=0;combo=0;cleared=0;hits=0;tries=0;secs=0;unlocked=0;wrongSet=[];
  $('vTime').textContent='00:00';
  closeVeil();
  loadLevel(0,false);
  save();
  toast('已重新开始');
}

/* ==================== 键盘 ==================== */
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(e.key==='Escape'){clearPick();closeVeil();closeLevelPicker();}
  else if(k==='h'){useHint();}
  else if(k==='r'){shuffleCards();}
});

/* ==================== 启动 ==================== */
(function init(){
  const resumed=load();
  $('btnSound').setAttribute('aria-pressed',String(sound));
  $('btnSound').textContent=sound?'音效':'静音';
  $('btnReveal').setAttribute('aria-pressed',String(reveal));
  $('btnReveal').textContent=reveal?'对答案 · 开':'对答案';
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  $('btnTheme').setAttribute('aria-pressed',String(dark));
  $('btnTheme').textContent=dark?'日间':'夜间';
  $('vTime').textContent=fmt(secs);
  loadLevel(lvIndex,true);
  startClock();
  if(resumed) setTimeout(()=>toast('已恢复上次进度（第 '+(lvIndex+1)+' 关）',2200),400);
})();
window.addEventListener('beforeunload',save);
</script>
